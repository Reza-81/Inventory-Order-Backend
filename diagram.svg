<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 1020" width="1440" height="1020"
     font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <title>InventoryOrder · Clean Architecture &amp; Request Flow</title>
  <desc>Animated diagram of an ASP.NET Core 10 clean-architecture inventory/order system.</desc>

  <defs>
    <style>
      .title      { fill:#F1F5F9; font-size:26px; font-weight:700; letter-spacing:1px; }
      .subtitle   { fill:#94A3B8; font-size:13px; letter-spacing:2px; }
      .layerLabel { font-size:15px; font-weight:700; letter-spacing:1.5px; }
      .boxText    { fill:#E2E8F0; font-size:13px; font-weight:600; }
      .boxSub     { fill:#94A3B8; font-size:10.5px; }
      .flowLabel  { fill:#64748B; font-size:10.5px; letter-spacing:0.5px; }
      .legend     { fill:#94A3B8; font-size:11px; }

      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
      @keyframes glow  { 0%,100%{opacity:.25} 50%{opacity:.8} }
      @keyframes rise  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

      .pulse { animation:pulse 2.4s ease-in-out infinite; }
      .rise  { animation:rise  3s   ease-in-out infinite; }

      .layerBox { fill:rgba(15,23,42,.55); stroke-width:1.5; }
      .node     { stroke-width:1.4; }
      .node:hover { filter:brightness(1.25); }
    </style>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="gApi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gDom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#78350F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gInf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════ BACKGROUND ══════════ -->
  <rect width="1440" height="1020" fill="url(#bgGlow)"/>

  <g stroke="#1E293B" stroke-width="1" opacity="0.55">
    <path d="M0 60H1440 M0 120H1440 M0 180H1440 M0 240H1440 M0 300H1440 M0 360H1440
             M0 420H1440 M0 480H1440 M0 540H1440 M0 600H1440 M0 660H1440 M0 720H1440
             M0 780H1440 M0 840H1440 M0 900H1440 M0 960H1440"/>
    <path d="M60 0V1020 M120 0V1020 M180 0V1020 M240 0V1020 M300 0V1020 M360 0V1020
             M420 0V1020 M480 0V1020 M540 0V1020 M600 0V1020 M660 0V1020 M720 0V1020
             M780 0V1020 M840 0V1020 M900 0V1020 M960 0V1020 M1020 0V1020 M1080 0V1020
             M1140 0V1020 M1200 0V1020 M1260 0V1020 M1320 0V1020 M1380 0V1020 M1440 0V1020"/>
  </g>

  <!-- ══════════ HEADER ══════════ -->
  <text class="title" x="720" y="42" text-anchor="middle">InventoryOrder · Clean Architecture &amp; Request Flow</text>
  <text class="subtitle" x="720" y="66" text-anchor="middle">ASP.NET CORE 10 · MINIMAL API · MEDIATR · EF CORE · MYSQL · REDIS</text>

  <!-- ══════════ LEGEND ══════════ -->
  <g transform="translate(1140,16)">
    <rect x="0" y="0" width="252" height="52" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="16" cy="17" r="5" fill="#38BDF8"/>
    <text class="legend" x="28" y="21">Request flow</text>
    <circle cx="140" cy="17" r="5" fill="#F59E0B"/>
    <text class="legend" x="152" y="21">Domain logic</text>
    <circle cx="16" cy="37" r="5" fill="#34D399"/>
    <text class="legend" x="28" y="41">Infrastructure</text>
    <circle cx="140" cy="37" r="5" fill="#A78BFA"/>
    <text class="legend" x="152" y="41">Pipeline</text>
  </g>

  <!-- ══════════════════════════════════════════════════════
       CLIENT
       ══════════════════════════════════════════════════════ -->
  <g class="rise">
    <rect x="620" y="92" width="200" height="52" rx="12"
          fill="#0F172A" stroke="#38BDF8" stroke-width="1.6"/>
    <text class="boxText" x="720" y="114" text-anchor="middle">HTTP CLIENT</text>
    <text class="boxSub"  x="720" y="131" text-anchor="middle">Browser / Mobile / curl</text>
  </g>

  <!-- Client → API -->
  <path id="p1" d="M720 144 L720 180" stroke="#38BDF8" stroke-width="2"
        marker-end="url(#arrowBlue)" fill="none"/>
  <circle r="4.5" fill="#38BDF8" filter="url(#softGlow)">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath xlink:href="#p1"/>
    </animateMotion>
  </circle>
  <text class="flowLabel" x="732" y="168">POST /orders · JWT Bearer</text>

  <!-- ══════════════════════════════════════════════════════
       API LAYER
       ══════════════════════════════════════════════════════ -->
  <rect class="layerBox" x="60" y="180" width="1300" height="200" rx="16"
        fill="url(#gApi)" stroke="#3B82F6"/>

  <text class="layerLabel" x="86" y="207" fill="#60A5FA">①  API LAYER</text>
  <text class="boxSub" x="232" y="207" fill="#64748B">InventoryOrder.Api</text>
  <text class="boxSub" x="1340" y="207" fill="#475569" text-anchor="end">Program.cs · Minimal API Endpoints</text>

  <!-- Middleware chain -->
  <g>
    <rect x="90"  y="228" width="200" height="58" rx="10" fill="#0B1220" stroke="#2563EB" class="node"/>
    <text class="boxText" x="190" y="252" text-anchor="middle">CorrelationId</text>
    <text class="boxSub"  x="190" y="270" text-anchor="middle">Middleware</text>

    <rect x="330" y="228" width="200" height="58" rx="10" fill="#0B1220" stroke="#2563EB" class="node"/>
    <text class="boxText" x="430" y="252" text-anchor="middle">ApiExceptionHandler</text>
    <text class="boxSub"  x="430" y="270" text-anchor="middle">IExceptionHandler → RFC 7807</text>

    <rect x="570" y="228" width="200" height="58" rx="10" fill="#0B1220" stroke="#2563EB" class="node"/>
    <text class="boxText" x="670" y="252" text-anchor="middle">Rate Limiter</text>
    <text class="boxSub"  x="670" y="270" text-anchor="middle">"auth" · "writes"</text>

    <rect x="810" y="228" width="200" height="58" rx="10" fill="#0B1220" stroke="#2563EB" class="node"/>
    <text class="boxText" x="910" y="252" text-anchor="middle">JWT Authentication</text>
    <text class="boxSub"  x="910" y="270" text-anchor="middle">JwtBearer · HS256</text>

    <rect x="1050" y="228" width="200" height="58" rx="10" fill="#0B1220" stroke="#2563EB" class="node"/>
    <text class="boxText" x="1150" y="252" text-anchor="middle">Authorization</text>
    <text class="boxSub"  x="1150" y="270" text-anchor="middle">Policy "CanAdjustStock"</text>
  </g>

  <!-- arrows between middleware -->
  <g stroke="#3B82F6" stroke-width="1.4" opacity="0.85">
    <path d="M290 257 L328 257" marker-end="url(#arrowBlue)"/>
    <path d="M530 257 L568 257" marker-end="url(#arrowBlue)"/>
    <path d="M770 257 L808 257" marker-end="url(#arrowBlue)"/>
    <path d="M1010 257 L1048 257" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Endpoints box -->
  <rect x="90" y="306" width="1160" height="54" rx="10"
        fill="#0B1220" stroke="#1D4ED8" stroke-dasharray="4 4"/>
  <text class="boxText" x="106" y="326" fill="#93C5FD">Endpoints</text>
  <text class="boxSub"  x="106" y="345">
    POST /auth/login   ·   POST /orders   ·   POST /inventory/adjustments   ·
    GET /warehouses/{id}/stock   ·   POST /orders/{id}/shipments   ·   GET /ping   ·   GET /health
  </text>

  <!-- ══════════ API → APPLICATION ══════════ -->
  <path id="p2" d="M720 380 L720 424" stroke="#A78BFA" stroke-width="2.4"
        marker-end="url(#arrowPurple)" fill="none"/>
  <circle r="5" fill="#A78BFA" filter="url(#softGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath xlink:href="#p2"/>
    </animateMotion>
  </circle>
  <text class="flowLabel" x="732" y="406">ISender.Send(command)  →  MediatR</text>

  <!-- ══════════════════════════════════════════════════════
       APPLICATION LAYER
       ══════════════════════════════════════════════════════ -->
  <rect class="layerBox" x="60" y="424" width="1300" height="200" rx="16"
        fill="url(#gApp)" stroke="#8B5CF6"/>

  <text class="layerLabel" x="86" y="451" fill="#C4B5FD">②  APPLICATION LAYER</text>
  <text class="boxSub" x="280" y="451" fill="#64748B">InventoryOrder.Application · CQRS + Pipeline Behaviors</text>
  <text class="boxSub" x="1340" y="451" fill="#475569" text-anchor="end">FluentValidation · MediatR</text>

  <!-- Behaviors pipeline -->
  <g>
    <rect x="90"  y="470" width="200" height="62" rx="10" fill="#0B1220" stroke="#7C3AED" class="node"/>
    <text class="boxText" x="190" y="494" text-anchor="middle">LoggingBehavior</text>
    <text class="boxSub"  x="190" y="513" text-anchor="middle">Stopwatch · ILogger</text>

    <rect x="330" y="470" width="200" height="62" rx="10" fill="#0B1220" stroke="#7C3AED" class="node"/>
    <text class="boxText" x="430" y="494" text-anchor="middle">ValidationBehavior</text>
    <text class="boxSub"  x="430" y="513" text-anchor="middle">FluentValidation</text>

    <rect x="570" y="470" width="200" height="62" rx="10" fill="#0B1220" stroke="#7C3AED" class="node"/>
    <text class="boxText" x="670" y="494" text-anchor="middle">TransactionBehavior</text>
    <text class="boxSub"  x="670" y="513" text-anchor="middle">ICommand · retries</text>

    <rect x="810" y="470" width="200" height="62" rx="10" fill="#0B1220" stroke="#7C3AED" class="node"/>
    <text class="boxText" x="910" y="494" text-anchor="middle">IdempotencyBehavior</text>
    <text class="boxSub"  x="910" y="513" text-anchor="middle">SHA-256 · 24h records</text>

    <rect x="1050" y="470" width="200" height="62" rx="10" fill="#0B1220" stroke="#7C3AED" class="node"/>
    <text class="boxText" x="1150" y="494" text-anchor="middle">CacheBehavior</text>
    <text class="boxSub"  x="1150" y="513" text-anchor="middle">ICacheableQuery</text>
  </g>

  <g stroke="#A78BFA" stroke-width="1.4" opacity="0.85">
    <path d="M290 501 L328 501" marker-end="url(#arrowPurple)"/>
    <path d="M530 501 L568 501" marker-end="url(#arrowPurple)"/>
    <path d="M770 501 L808 501" marker-end="url(#arrowPurple)"/>
    <path d="M1010 501 L1048 501" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- Handlers box -->
  <rect x="90" y="548" width="1160" height="60" rx="10"
        fill="#0B1220" stroke="#6D28D9"/>
  <text class="boxText" x="106" y="570" fill="#C4B5FD">Handlers (Features)</text>
  <text class="boxSub"  x="106" y="591">
    LoginHandler · PlaceOrderHandler · ShipOrderHandler · AdjustStockHandler · GetStockLevelsHandler · PingQueryHandler
  </text>

  <!-- Side pill for notifications -->
  <g>
    <rect x="1266" y="548" width="74" height="60" rx="10" fill="#0B1220" stroke="#6D28D9"/>
    <text class="boxSub" x="1303" y="572" text-anchor="middle" fill="#C4B5FD">INotification</text>
    <text class="boxSub" x="1303" y="590" text-anchor="middle" fill="#94A3B8">StockChanged</text>
  </g>

  <!-- ══════════ APPLICATION → DOMAIN ══════════ -->
  <path id="p3" d="M370 624 L370 664" stroke="#F59E0B" stroke-width="2.2"
        marker-end="url(#arrowGrey)" fill="none"/>
  <circle r="5" fill="#F59E0B" filter="url(#softGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath xlink:href="#p3"/>
    </animateMotion>
  </circle>

  <!-- ══════════ APPLICATION → INFRASTRUCTURE ══════════ -->
  <path id="p4" d="M1030 624 L1030 664" stroke="#34D399" stroke-width="2.2"
        marker-end="url(#arrowGreen)" fill="none"/>
  <circle r="5" fill="#34D399" filter="url(#softGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s">
      <mpath xlink:href="#p4"/>
    </animateMotion>
  </circle>

  <!-- ══════════════════════════════════════════════════════
       DOMAIN LAYER
       ══════════════════════════════════════════════════════ -->
  <rect class="layerBox" x="60" y="664" width="620" height="180" rx="16"
        fill="url(#gDom)" stroke="#F59E0B"/>

  <text class="layerLabel" x="86" y="691" fill="#FCD34D">③  DOMAIN LAYER</text>
  <text class="boxSub" x="266" y="691" fill="#64748B">InventoryOrder.Domain · zero dependencies</text>

  <rect x="86" y="706" width="272" height="56" rx="10" fill="#0B1220" stroke="#B45309"/>
  <text class="boxText" x="100" y="727" fill="#FCD34D">Entities</text>
  <text class="boxSub"  x="100" y="747">Product · Warehouse · StockItem · SalesOrder</text>

  <rect x="376" y="706" width="280" height="56" rx="10" fill="#0B1220" stroke="#B45309"/>
  <text class="boxText" x="390" y="727" fill="#FCD34D">Value Objects</text>
  <text class="boxSub"  x="390" y="747">Sku · Money · Address</text>

  <rect x="86" y="772" width="272" height="56" rx="10" fill="#0B1220" stroke="#B45309"/>
  <text class="boxText" x="100" y="793" fill="#FCD34D">Enums</text>
  <text class="boxSub"  x="100" y="813">OrderStatus · ShipmentStatus · UserRole</text>

  <rect x="376" y="772" width="280" height="56" rx="10" fill="#0B1220" stroke="#B45309"/>
  <text class="boxText" x="390" y="793" fill="#FCD34D">Contracts</text>
  <text class="boxSub"  x="390" y="813">IAuditable · domain invariants</text>

  <!-- ══════════════════════════════════════════════════════
       INFRASTRUCTURE LAYER
       ══════════════════════════════════════════════════════ -->
  <rect class="layerBox" x="720" y="664" width="640" height="180" rx="16"
        fill="url(#gInf)" stroke="#10B981"/>

  <text class="layerLabel" x="746" y="691" fill="#6EE7B7">④  INFRASTRUCTURE LAYER</text>
  <text class="boxSub" x="1030" y="691" fill="#64748B">InventoryOrder.Infrastructure</text>

  <rect x="746" y="706" width="282" height="56" rx="10" fill="#0B1220" stroke="#047857"/>
  <text class="boxText" x="760" y="727" fill="#6EE7B7">Persistence</text>
  <text class="boxSub"  x="760" y="747">AppDbContext · EF Core configs · Migrations</text>

  <rect x="1046" y="706" width="290" height="56" rx="10" fill="#0B1220" stroke="#047857"/>
  <text class="boxText" x="1060" y="727" fill="#6EE7B7">Caching</text>
  <text class="boxSub"  x="1060" y="747">RedisCacheService · IDistributedCache</text>

  <rect x="746" y="772" width="282" height="56" rx="10" fill="#0B1220" stroke="#047857"/>
  <text class="boxText" x="760" y="793" fill="#6EE7B7">Security</text>
  <text class="boxSub"  x="760" y="813">JwtAccessTokenService · PasswordService</text>

  <rect x="1046" y="772" width="290" height="56" rx="10" fill="#0B1220" stroke="#047857"/>
  <text class="boxText" x="1060" y="793" fill="#6EE7B7">Cross-cutting</text>
  <text class="boxSub"  x="1060" y="813">EfTransactionManager · AuditInterceptor</text>

  <!-- ══════════ INFRA → DATA STORES ══════════ -->
  <path id="p5" d="M800 844 C 800 878 545 872 545 900"
        stroke="#34D399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <circle r="4.5" fill="#34D399" filter="url(#softGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite">
      <mpath xlink:href="#p5"/>
    </animateMotion>
  </circle>

  <path id="p6" d="M1100 844 C 1100 878 895 872 895 900"
        stroke="#F87171" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <circle r="4.5" fill="#F87171" filter="url(#softGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.8s">
      <mpath xlink:href="#p6"/>
    </animateMotion>
  </circle>

  <!-- ══════════════════════════════════════════════════════
       DATA STORES
       ══════════════════════════════════════════════════════ -->
  <g class="rise">
    <rect x="410" y="900" width="270" height="78" rx="14"
          fill="#0B1220" stroke="#F59E0B" stroke-width="1.6"/>
    <ellipse cx="545" cy="918" rx="110" ry="9" fill="none" stroke="#F59E0B" opacity="0.55"/>
    <text class="boxText" x="545" y="946" text-anchor="middle" fill="#FCD34D">MySQL 8.0</text>
    <text class="boxSub"  x="545" y="963" text-anchor="middle">Pomelo · EF Core 9 · row-version concurrency</text>
  </g>

  <g class="rise" style="animation-delay:.5s">
    <rect x="760" y="900" width="270" height="78" rx="14"
          fill="#0B1220" stroke="#F87171" stroke-width="1.6"/>
    <text class="boxText" x="895" y="946" text-anchor="middle" fill="#FCA5A5">Redis</text>
    <text class="boxSub"  x="895" y="963" text-anchor="middle">IDistributedCache · stock:warehouse:*</text>
  </g>

  <!-- ══════════ RETURN / RESPONSE PATH ══════════ -->
  <path id="p7" d="M1360 754 L1420 754 L1420 118 L822 118"
        stroke="#94A3B8" stroke-width="1.6" fill="none"
        stroke-dasharray="6 6" marker-end="url(#arrowGrey)"/>
  <text class="flowLabel" x="1412" y="740" text-anchor="end" fill="#94A3B8">Response · DTO ↑</text>
  <circle r="3.6" fill="#CBD5E1">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath xlink:href="#p7"/>
    </animateMotion>
  </circle>

</svg>