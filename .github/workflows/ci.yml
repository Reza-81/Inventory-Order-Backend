name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet test --no-restore --configuration Release
      - run: dotnet build InventoryOrder.Api/InventoryOrder.Api.csproj --no-restore --configuration Release
      - run: docker build --tag inventory-order-api:${{ github.sha }} .
